<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule Your Roof Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#F5F4F0;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px 48px}
.card{background:#fff;border-radius:16px;width:100%;max-width:480px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08),0 8px 32px rgba(0,0,0,.06)}
.brand-bar{padding:20px 28px 18px;display:flex;align-items:center;gap:12px}
.brand-logo{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:#fff;letter-spacing:.5px;flex-shrink:0}
.brand-name{font-size:15px;font-weight:600;line-height:1.2}
.brand-tagline{font-size:12px;color:#6B7280;margin-top:1px}
.progress-wrap{padding:0 28px 0;position:relative}
.progress-track{height:3px;background:#F0EEE9;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;border-radius:2px;transition:width .4s ease}
.progress-label{font-size:11px;color:#9CA3AF;margin-top:6px;text-align:right;margin-bottom:16px}
.form-body{padding:24px 28px 28px}
.step{display:none}
.step.active{display:block}
.step-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.step-icon svg{width:22px;height:22px}
.question{font-size:19px;font-weight:600;color:#111827;line-height:1.35;margin-bottom:6px}
.sublabel{font-size:13px;color:#6B7280;line-height:1.5;margin-bottom:20px}
.field input{width:100%;padding:12px 14px;border:1.5px solid #E5E7EB;border-radius:10px;font-size:15px;font-family:inherit;color:#111827;outline:none;transition:border-color .2s,box-shadow .2s}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
.field input::placeholder{color:#9CA3AF}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{border:1.5px solid #E5E7EB;border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:all .15s;user-select:none}
.choice:hover{border-color:#D1D5DB;background:#FAFAFA}
.choice.selected{border-color:var(--accent);background:var(--accent-light)}
.choice-radio{width:18px;height:18px;border-radius:50%;border:2px solid #D1D5DB;flex-shrink:0;transition:all .15s;display:flex;align-items:center;justify-content:center}
.choice.selected .choice-radio{border-color:var(--accent);background:var(--accent)}
.choice.selected .choice-radio::after{content:'';width:6px;height:6px;border-radius:50%;background:#fff}
.choice-text{font-size:14px;color:#374151;font-weight:500}
.choice.selected .choice-text{color:var(--accent-dark)}
.btn-row{display:flex;gap:10px;margin-top:24px}
.btn{padding:12px 20px;border-radius:10px;font-size:15px;font-weight:500;font-family:inherit;cursor:pointer;border:none;transition:all .15s;flex:1}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{filter:brightness(1.08)}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-back{background:#F3F4F6;color:#6B7280;flex:0 0 auto;padding:12px 16px}
.btn-back:hover{background:#E5E7EB}
.welcome{text-align:center;padding:8px 0 4px}
.welcome-icon{width:64px;height:64px;border-radius:18px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center}
.welcome-icon svg{width:30px;height:30px}
.welcome h1{font-size:22px;font-weight:600;color:#111827;margin-bottom:8px;line-height:1.3}
.welcome p{font-size:14px;color:#6B7280;line-height:1.6;margin-bottom:24px}
.trust-row{display:flex;justify-content:center;gap:20px;margin-bottom:28px}
.trust-item{display:flex;align-items:center;gap:6px;font-size:12px;color:#6B7280}
.trust-item svg{width:14px;height:14px;flex-shrink:0}
.confirm-screen{text-align:center;padding:16px 0 8px}
.confirm-icon{width:72px;height:72px;border-radius:50%;margin:0 auto 20px;display:flex;align-items:center;justify-content:center}
.confirm-icon svg{width:34px;height:34px;stroke:#fff;stroke-width:2.5}
.confirm h2{font-size:21px;font-weight:600;color:#111827;margin-bottom:8px}
.confirm p{font-size:14px;color:#6B7280;line-height:1.65;margin-bottom:6px}
.confirm-detail{font-size:13px;color:#9CA3AF;margin-top:16px;padding-top:16px;border-top:1px solid #F3F4F6}
.error-msg{font-size:12px;color:#DC2626;margin-top:6px;display:none}
.error-msg.show{display:block}

/* ADMIN STYLES */
.admin-wrap{max-width:680px;width:100%}
.admin-header{background:#fff;border-radius:16px;padding:20px 24px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.admin-header h1{font-size:18px;font-weight:600;color:#111827}
.admin-header p{font-size:13px;color:#6B7280;margin-top:2px}
.lead-card{background:#fff;border-radius:14px;padding:20px 22px;margin-bottom:12px;border-left:4px solid #E5E7EB}
.lead-card.hot{border-left-color:#DC2626}
.lead-card.warm{border-left-color:#F59E0B}
.lead-card.cool{border-left-color:#3B82F6}
.lead-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.lead-name{font-size:16px;font-weight:600;color:#111827}
.lead-time{font-size:12px;color:#9CA3AF}
.badge{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.badge.hot{background:#FEF2F2;color:#DC2626}
.badge.warm{background:#FFFBEB;color:#D97706}
.badge.cool{background:#EFF6FF;color:#2563EB}
.lead-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.lead-field{font-size:12px}
.lead-field-label{color:#9CA3AF;margin-bottom:1px}
.lead-field-value{color:#374151;font-weight:500;font-size:13px}
.score-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.score-track{flex:1;height:6px;background:#F3F4F6;border-radius:3px;overflow:hidden}
.score-fill{height:100%;border-radius:3px}
.score-text{font-size:12px;font-weight:600;min-width:36px;text-align:right}
.score-reasons{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.score-tag{font-size:11px;background:#F0FDF4;color:#166534;padding:2px 8px;border-radius:4px}
.copy-btn{width:100%;padding:9px;border:1.5px solid #E5E7EB;border-radius:8px;background:#fff;font-size:13px;font-weight:500;cursor:pointer;color:#374151;font-family:inherit;transition:all .15s}
.copy-btn:hover{background:#F9FAFB;border-color:#D1D5DB}
.copy-btn.copied{background:#ECFDF5;border-color:#6EE7B7;color:#065F46}
.empty-state{text-align:center;padding:48px 24px;color:#9CA3AF;font-size:14px}
.admin-clear{font-size:12px;color:#9CA3AF;cursor:pointer;text-decoration:underline;background:none;border:none;font-family:inherit;margin-top:8px}
.admin-clear:hover{color:#6B7280}
</style>
</head>
<body>

<div id="app"></div>

<script>
const BRANDS = {
  supreme: {
    name: 'Free Inspection',
    tagline: 'Texas Storm Restoration Specialists',
    logo: 'SR',
    primary: '#152F52',
    accent: '#C9922D',
    accentLight: 'rgba(201,146,45,0.1)',
    accentDark: '#9B6E1A'
  },
  kidd: {
    name: 'Kidd Roofing Pro',
    tagline: 'Austin\'s Trusted Storm Experts',
    logo: 'KR',
    primary: '#1A3A2A',
    accent: '#E07836',
    accentLight: 'rgba(224,120,54,0.1)',
    accentDark: '#A8531A'
  },
  lon: {
    name: 'Lon Smith Roofing',
    tagline: 'DFW\'s Most Trusted Roofers',
    logo: 'LS',
    primary: '#2B3A4A',
    accent: '#2B6CB0',
    accentLight: 'rgba(43,108,176,0.1)',
    accentDark: '#1A4A80'
  },
  rhino: {
    name: 'Rhino Roofers',
    tagline: 'San Antonio Storm Restoration',
    logo: 'RR',
    primary: '#1C1C2E',
    accent: '#DC2626',
    accentLight: 'rgba(220,38,38,0.1)',
    accentDark: '#991B1B'
  }
};

const QUESTIONS = [
  {
    id: 'name',
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
    label: 'What\'s your full name?',
    sub: 'So we know who to expect when our team arrives.',
    type: 'text',
    placeholder: 'John Smith',
    key: 'name'
  },
  {
    id: 'address',
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
    label: 'What\'s your property address?',
    sub: 'We\'ll confirm your home is in the affected area and send the right team.',
    type: 'text',
    placeholder: '1234 Oak Lane, Fort Worth TX 76104',
    key: 'address'
  },
  {
    id: 'phone',
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.4 2 2 0 0 1 3.6 1.21h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 9a16 16 0 0 0 6.09 6.09l1.87-1.87a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
    label: 'Best number to reach you?',
    sub: 'Our team will call to confirm your appointment — usually within a few hours.',
    type: 'tel',
    placeholder: '(817) 555-0123',
    key: 'phone'
  },
  {
    id: 'coverage',
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
    label: 'Do you have homeowners coverage?',
    sub: 'This helps us understand the best way to assist you with the assessment.',
    type: 'choice',
    key: 'coverage',
    options: [
      { value: 'yes', label: 'Yes — I have homeowners coverage' },
      { value: 'no', label: 'No — I don\'t have coverage' },
      { value: 'unsure', label: 'I\'m not sure' }
    ]
  },
  {
    id: 'yearBuilt',
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
    label: 'Roughly when was your home built?',
    sub: 'Older roofing materials tend to be more vulnerable to hail damage.',
    type: 'choice',
    key: 'yearBuilt',
    options: [
      { value: 'before2010', label: 'Before 2010' },
      { value: '2010to2015', label: '2010 – 2015' },
      { value: 'after2015', label: 'After 2015' },
      { value: 'unsure', label: 'Not sure' }
    ]
  },
  {
    id: 'damage',
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
    label: 'Have you noticed any visible damage?',
    sub: 'Most storm damage isn\'t obvious from the ground — but some signs are.',
    type: 'choice',
    key: 'damage',
    options: [
      { value: 'yes', label: 'Yes — leaks, missing shingles, or dents' },
      { value: 'unsure', label: 'Not sure — haven\'t looked closely yet' },
      { value: 'no', label: 'No visible damage noticed' }
    ]
  },
  {
    id: 'timing',
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
    label: 'When works best for a visit?',
    sub: 'Our team is actively working in your area following the recent storm.',
    type: 'choice',
    key: 'timing',
    options: [
      { value: 'asap', label: 'As soon as possible — this week' },
      { value: 'nextweek', label: 'Next week works better for me' },
      { value: 'info', label: 'Just looking for more information first' }
    ]
  }
];

function scoreLead(a) {
  let s = 0, r = [];
  s += 3; r.push('+3 pts — property in storm-affected area');
  if (a.coverage === 'yes') { s += 3; r.push('+3 pts — has homeowners coverage'); }
  if (a.yearBuilt === 'before2010' || a.yearBuilt === '2010to2015') { s += 2; r.push('+2 pts — home built before 2015'); }
  if (a.timing === 'asap') { s += 3; r.push('+3 pts — requesting visit ASAP'); }
  if (a.damage === 'yes') { s += 2; r.push('+2 pts — visible damage reported'); }
  const max = 13;
  const tier = s >= 10 ? 'hot' : s >= 6 ? 'warm' : 'cool';
  const label = s >= 10 ? '🔥 Hot Lead' : s >= 6 ? '🟡 Warm Lead' : '🔵 Cool Lead';
  return { score: s, max, tier, label, reasons: r };
}

function formatLeadCard(sub, brand) {
  const { score, label } = scoreLead(sub.answers);
  const a = sub.answers;
  const yearLabel = { before2010:'Before 2010','2010to2015':'2010–2015',after2015:'After 2015',unsure:'Not sure' };
  const timingLabel = { asap:'ASAP this week',nextweek:'Next week',info:'Info only' };
  const damageLabel = { yes:'Yes — visible damage',unsure:'Not sure yet',no:'No visible damage' };
  const coverageLabel = { yes:'Yes ✅',no:'No',unsure:'Not sure' };
  return `${label} — ${score}/${scoreLead(sub.answers).max} points
━━━━━━━━━━━━━━━━━━━━━━━━
Name: ${a.name}
Address: ${a.address}
Phone: ${a.phone}
Coverage: ${coverageLabel[a.coverage] || a.coverage}
Year Built: ${yearLabel[a.yearBuilt] || a.yearBuilt}
Damage: ${damageLabel[a.damage] || a.damage}
Timing: ${timingLabel[a.timing] || a.timing}
━━━━━━━━━━━━━━━━━━━━━━━━
Brand: ${brand.name}
Submitted: ${new Date(sub.ts).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})}`;
}

const urlParams = new URLSearchParams(window.location.search);
const brandKey = urlParams.get('brand') || 'supreme';
const isAdmin = urlParams.get('admin') === 'true';
const brand = BRANDS[brandKey] || BRANDS.supreme;

document.title = brand.name + ' — Roof Assessment';

document.documentElement.style.setProperty('--accent', brand.accent);
document.documentElement.style.setProperty('--accent-light', brand.accentLight);
document.documentElement.style.setProperty('--accent-dark', brand.accentDark);

const STORAGE_KEY = 'roof_leads_v1';
function getLeads() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e) { return []; } }
function saveLeads(leads) { localStorage.setItem(STORAGE_KEY, JSON.stringify(leads)); }

if (isAdmin) {
  renderAdmin();
} else {
  renderForm();
}

function renderAdmin() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'admin-wrap';
  const leads = getLeads().reverse();

  wrap.innerHTML = `
    <div class="admin-header">
      <div>
        <h1>Lead submissions</h1>
        <p>${leads.length} total ${leads.length === 1 ? 'submission' : 'submissions'}</p>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:10px;height:10px;border-radius:50%;background:${brand.accent}"></div>
        <span style="font-size:13px;font-weight:500;color:#374151">${brand.name}</span>
      </div>
    </div>
  `;

  if (leads.length === 0) {
    wrap.innerHTML += `<div class="empty-state"><p style="font-size:32px;margin-bottom:12px">📋</p><p>No submissions yet.</p><p style="margin-top:4px;font-size:12px">Share the form link with homeowners to start collecting leads.</p></div>`;
  } else {
    leads.forEach((sub, i) => {
      const { score, max, tier, label, reasons } = scoreLead(sub.answers);
      const pct = Math.round((score / max) * 100);
      const barColor = tier === 'hot' ? '#DC2626' : tier === 'warm' ? '#F59E0B' : '#3B82F6';
      const card = document.createElement('div');
      card.className = `lead-card ${tier}`;
      card.innerHTML = `
        <div class="lead-top">
          <div>
            <div class="lead-name">${escHtml(sub.answers.name || '—')}</div>
            <div class="lead-time">${new Date(sub.ts).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</div>
          </div>
          <span class="badge ${tier}">${label}</span>
        </div>
        <div class="score-bar">
          <div class="score-track"><div class="score-fill" style="width:${pct}%;background:${barColor}"></div></div>
          <span class="score-text" style="color:${barColor}">${score}/${max}</span>
        </div>
        <div class="score-reasons">${reasons.map(r=>`<span class="score-tag">${r}</span>`).join('')}</div>
        <div class="lead-grid">
          <div class="lead-field"><div class="lead-field-label">Address</div><div class="lead-field-value">${escHtml(sub.answers.address || '—')}</div></div>
          <div class="lead-field"><div class="lead-field-label">Phone</div><div class="lead-field-value">${escHtml(sub.answers.phone || '—')}</div></div>
          <div class="lead-field"><div class="lead-field-label">Coverage</div><div class="lead-field-value">${sub.answers.coverage === 'yes' ? 'Yes ✅' : sub.answers.coverage === 'no' ? 'No' : 'Not sure'}</div></div>
          <div class="lead-field"><div class="lead-field-label">Timing</div><div class="lead-field-value">${sub.answers.timing === 'asap' ? 'ASAP this week' : sub.answers.timing === 'nextweek' ? 'Next week' : 'Info first'}</div></div>
        </div>
        <button class="copy-btn" data-idx="${i}">Copy lead card for contractor</button>
      `;
      wrap.appendChild(card);
      card.querySelector('.copy-btn').addEventListener('click', function() {
        const txt = formatLeadCard(sub, brand);
        navigator.clipboard.writeText(txt).then(() => {
          this.textContent = '✓ Copied to clipboard';
          this.classList.add('copied');
          setTimeout(() => { this.textContent = 'Copy lead card for contractor'; this.classList.remove('copied'); }, 2500);
        });
      });
    });
    const clearWrap = document.createElement('div');
    clearWrap.style.cssText = 'text-align:center;padding:8px 0 4px';
    clearWrap.innerHTML = `<button class="admin-clear" id="clearBtn">Clear all submissions</button>`;
    wrap.appendChild(clearWrap);
    clearWrap.querySelector('#clearBtn').addEventListener('click', () => {
      if (confirm('Clear all submissions? This cannot be undone.')) { saveLeads([]); renderAdmin(); }
    });
  }

  app.appendChild(wrap);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderForm() {
  const app = document.getElementById('app');
  const answers = {};
  let currentStep = 0;
  const totalSteps = QUESTIONS.length;

  const card = document.createElement('div');
  card.className = 'card';

  card.innerHTML = `
    <div class="brand-bar" style="background:${brand.primary}">
      <div class="brand-logo" style="background:rgba(255,255,255,0.18)">${brand.logo}</div>
      <div>
        <div class="brand-name" style="color:#fff">${brand.name}</div>
        <div class="brand-tagline" style="color:rgba(255,255,255,0.6)">${brand.tagline}</div>
      </div>
    </div>
    <div class="progress-wrap" id="progressWrap" style="padding-top:16px">
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="background:${brand.accent};width:0%"></div></div>
      <div class="progress-label" id="progressLabel"></div>
    </div>
    <div class="form-body" id="formBody"></div>
  `;

  app.appendChild(card);

  function updateProgress() {
    const pct = Math.round((currentStep / totalSteps) * 100);
    document.getElementById('progressFill').style.width = pct + '%';
    if (currentStep === 0) {
      document.getElementById('progressLabel').textContent = '';
      document.getElementById('progressWrap').style.display = 'none';
    } else if (currentStep <= totalSteps) {
      document.getElementById('progressWrap').style.display = '';
      document.getElementById('progressLabel').textContent = `Step ${currentStep} of ${totalSteps}`;
    }
  }

  function render() {
    updateProgress();
    const body = document.getElementById('formBody');

    if (currentStep === 0) {
      body.innerHTML = `
        <div class="welcome">
          <div class="welcome-icon" style="background:${brand.accentLight}">
            <svg viewBox="0 0 24 24" fill="none" stroke="${brand.accent}" stroke-width="1.8" width="30" height="30"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          </div>
          <h1>Schedule your complimentary roof assessment</h1>
          <p>Following the recent storm, our team is inspecting properties in your area. Takes about 20 minutes and costs you nothing.</p>
          <div class="trust-row">
            <div class="trust-item"><svg viewBox="0 0 24 24" fill="none" stroke="${brand.accent}" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg><span>No charge</span></div>
            <div class="trust-item"><svg viewBox="0 0 24 24" fill="none" stroke="${brand.accent}" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg><span>No pressure</span></div>
            <div class="trust-item"><svg viewBox="0 0 24 24" fill="none" stroke="${brand.accent}" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg><span>20 minutes</span></div>
          </div>
          <button class="btn btn-primary" id="startBtn" style="width:100%;background:${brand.accent}">Book my assessment →</button>
        </div>
      `;
      document.getElementById('startBtn').addEventListener('click', () => { currentStep = 1; render(); });
      return;
    }

    if (currentStep > totalSteps) {
      renderConfirm(body);
      return;
    }

    const q = QUESTIONS[currentStep - 1];

    if (q.type === 'text' || q.type === 'tel') {
      body.innerHTML = `
        <div class="step active">
          <div class="step-icon" style="background:${brand.accentLight};color:${brand.accent}">${q.icon}</div>
          <div class="question">${q.label}</div>
          <div class="sublabel">${q.sub}</div>
          <div class="field">
            <input type="${q.type}" id="qInput" placeholder="${q.placeholder}" value="${answers[q.key] || ''}" autocomplete="off" />
            <div class="error-msg" id="errMsg">Please fill this in to continue.</div>
          </div>
          <div class="btn-row">
            ${currentStep > 1 ? '<button class="btn btn-back" id="backBtn">← Back</button>' : ''}
            <button class="btn btn-primary" id="nextBtn" style="background:${brand.accent}">Continue →</button>
          </div>
        </div>
      `;
      const input = document.getElementById('qInput');
      input.focus();
      input.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('nextBtn').click(); });
      document.getElementById('nextBtn').addEventListener('click', () => {
        const val = input.value.trim();
        if (!val) { document.getElementById('errMsg').classList.add('show'); return; }
        answers[q.key] = val;
        currentStep++;
        render();
      });
      if (document.getElementById('backBtn')) {
        document.getElementById('backBtn').addEventListener('click', () => { currentStep--; render(); });
      }
    } else {
      const choicesHtml = q.options.map(opt => `
        <div class="choice${answers[q.key] === opt.value ? ' selected' : ''}" data-val="${opt.value}">
          <div class="choice-radio"></div>
          <div class="choice-text">${opt.label}</div>
        </div>
      `).join('');

      body.innerHTML = `
        <div class="step active">
          <div class="step-icon" style="background:${brand.accentLight};color:${brand.accent}">${q.icon}</div>
          <div class="question">${q.label}</div>
          <div class="sublabel">${q.sub}</div>
          <div class="choices" id="choicesWrap">${choicesHtml}</div>
          <div class="error-msg" id="errMsg">Please select an option to continue.</div>
          <div class="btn-row" style="margin-top:20px">
            ${currentStep > 1 ? '<button class="btn btn-back" id="backBtn">← Back</button>' : ''}
            <button class="btn btn-primary" id="nextBtn" style="background:${brand.accent}" ${!answers[q.key] ? 'disabled' : ''}>Continue →</button>
          </div>
        </div>
      `;

      document.querySelectorAll('.choice').forEach(el => {
        el.addEventListener('click', () => {
          document.querySelectorAll('.choice').forEach(c => c.classList.remove('selected'));
          el.classList.add('selected');
          answers[q.key] = el.dataset.val;
          document.getElementById('nextBtn').disabled = false;
          document.getElementById('errMsg').classList.remove('show');
          setTimeout(() => { currentStep++; render(); }, 280);
        });
      });

      document.getElementById('nextBtn').addEventListener('click', () => {
        if (!answers[q.key]) { document.getElementById('errMsg').classList.add('show'); return; }
        currentStep++;
        render();
      });

      if (document.getElementById('backBtn')) {
        document.getElementById('backBtn').addEventListener('click', () => { currentStep--; render(); });
      }
    }
  }

  function renderConfirm(body) {
    document.getElementById('progressWrap').style.display = 'none';
    const submission = { answers, ts: Date.now(), brand: brandKey };
    const leads = getLeads();
    leads.push(submission);
    saveLeads(leads);

    body.innerHTML = `
      <div class="confirm-screen">
        <div class="confirm-icon" style="background:${brand.accent}">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" width="34" height="34"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <h2>You\'re all set, ${(answers.name || '').split(' ')[0]}!</h2>
        <p>We\'ve received your details and a member of our team will be in touch within a few hours to confirm your assessment time.</p>
        <p style="margin-top:8px">Storm season moves fast — we\'ll make sure your property is taken care of.</p>
        <div class="confirm-detail">
          <strong style="font-size:13px;color:#374151">${brand.name}</strong><br>
          Questions? Just reply to the email you received from us.
        </div>
      </div>
    `;
  }

  render();
}
</script>
</body>
</html>
